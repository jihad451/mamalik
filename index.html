   for(const z of ZONES){mc2.fillStyle='rgba(15,70,28,.55)';mc2.beginPath();mc2.arc(X(z.x),X(z.z),z.r*k,0,6.283);mc2.fill()}
   for(const c of CAMPS){if(S.cleared.includes(c.i))continue;mc2.fillStyle='#111';mc2.fillRect(X(c.x)-3,X(c.z)-3,6,6)}
   for(const b of blds){if(b.team!=='p')continue;mc2.fillStyle=b.t==='flag'?S.D.tunic:'#c8a060';mc2.fillRect(X(b.x)-2,X(b.z)-2,b.t==='flag'?6:3,b.t==='flag'?6:3)}
   for(const id in others){const o=others[id].d;mc2.fillStyle=cleanD(o.d).tunic;mc2.fillRect(X(o.flag.x)-3,X(o.flag.z)-3,6,6)}
   for(const h of horses){mc2.fillStyle=h.tame?'#fc4':'#b86';mc2.fillRect(X(h.g.position.x)-1.5,X(h.g.position.z)-1.5,3,3)}

   for(const u of units){if(u.team==='w'||u.hp<=0)continue;mc2.fillStyle=u.team==='e'?'#e33':u.team==='p'?'#fff':'#48f';mc2.fillRect(X(u.g.position.x)-1.5,X(u.g.position.z)-1.5,3,3)}}
  const p=P.g.position;if(inside){const R=INR.userData.R,d=5,pp=.5;let cx=p.x+Math.sin(yaw)*Math.cos(pp)*d,cz=p.z+Math.cos(yaw)*Math.cos(pp)*d;const dx=cx-INP.x,dz=cz-INP.z,dd=Math.hypot(dx,dz);if(dd>R-.35){cx=INP.x+dx/dd*(R-.35);cz=INP.z+dz/dd*(R-.35)}cam.position.set(cx,Math.min(2.8,Math.sin(pp)*d+1.5),cz);cam.lookAt(p.x,p.y+1.3,p.z)}
  else if(CM.on){const kf=Math.max(1,CM.h/26);scene.fog.near=45*kf;scene.fog.far*=kf;if(cam.far<700){cam.far=700;cam.updateProjectionMatrix()}const pp=CM.pp,d=CM.h,fy=H(CM.x,CM.z);cam.position.set(CM.x+Math.sin(CM.yaw)*Math.cos(pp)*d,fy+Math.sin(pp)*d,CM.z+Math.cos(CM.yaw)*Math.cos(pp)*d);cam.position.y=Math.max(cam.position.y,H(cam.position.x,cam.position.z)+2);cam.lookAt(CM.x,fy,CM.z)}
  else{if(cam.far>300){cam.far=300;cam.updateProjectionMatrix();scene.fog.near=45}const d=(P.rd?14:12)*camD;cam.position.set(p.x+Math.sin(yaw)*Math.cos(pit)*d,p.y+1.6+Math.sin(pit)*d,p.z+Math.cos(yaw)*Math.cos(pit)*d);cam.position.y=Math.max(cam.position.y,H(cam.position.x,cam.position.z)+1.2);cam.lookAt(p.x,p.y+1.5,p.z)}
 }else if(!started){const t=performance.now()/7000;cam.position.set(Math.sin(t)*45,24,Math.cos(t)*45);cam.lookAt(0,2,0)}
 ren.render(scene,cam)}
